<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Essential Color Insight</title>

  <!-- jsPDF library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 50%;
    }

    h1 {
      color: #333;
    }

    input {
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 10px;
    }

    button:hover {
      background: #444;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      display: none;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <img src="logo.png" class="logo" alt="Logo">

  <h1>🆓 Essential Color Insight</h1>
  <p>Upload your photo to discover your basic color identity</p>

  <input type="file" id="imageInput" accept="image/*">

  <br>

  <button onclick="analyzeImage()">Start Analysis</button>

  <div class="result" id="resultBox"></div>

  <button id="pdfBtn" style="display:none;" onclick="generatePDF()">
    Download PDF Report
  </button>

</div>

<script>
let reportData = "";

function analyzeImage() {
  const file = document.getElementById("imageInput").files[0];

  if (!file) {
    alert("Please upload an image first.");
    return;
  }

  // 🔴 Demo analysis (replace later with Hugging Face API)
  reportData = `
ESSENTIAL COLOR INSIGHT REPORT

Estimated Season: Soft Autumn

Suitable Colors:
- Beige
- Olive Green
- Warm Brown
- Cream

Unsuitable Colors:
- Neon shades
- Cool Blue
- Pure White

Harmony Feedback:
Your natural tones align best with warm muted colors,
creating a soft and balanced appearance.
`;

  document.getElementById("resultBox").innerText = reportData;
  document.getElementById("resultBox").style.display = "block";
  document.getElementById("pdfBtn").style.display = "inline-block";
}

function generatePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFont("helvetica");
  doc.setFontSize(12);

  const lines = doc.splitTextToSize(reportData, 180);
  doc.text(lines, 10, 20);

  doc.save("Essential_Color_Insight_Report.pdf");
}
</script>

</body>
</html>
